<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Sahana ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#ff4e50,#f9d423);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI;
    overflow:hidden;
}

/* MAIN CARD */
.card{
    background:white;
    padding:35px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    display:none;
    animation:pop 1s ease;
}

h1{ color:#ff004f; animation:glow 2s infinite; }
p{ font-size:22px; }

button{
    padding:14px 30px;
    font-size:20px;
    border:none;
    border-radius:30px;
    background:#ff004f;
    color:white;
    cursor:pointer;
}

.start{
    font-size:24px;
    padding:20px 40px;
    border-radius:40px;
}

/* POPUP */
.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    color:#b3003b;
    padding:30px 40px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    font-size:26px;
    transition:0.5s;
    z-index:10;
}
.popup.show{ transform:translate(-50%,-50%) scale(1); }

/* HEARTS */
.heart{
    position:absolute;
    font-size:20px;
    animation:float 6s linear infinite;
}

/* GLITTER */
.glitter{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    box-shadow:0 0 10px white;
    animation:glitter 3s linear infinite;
}

/* FIREWORK DOT */
.firework{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    animation:explode 1.5s ease-out forwards;
}

/* FLYING NAME */
.nameFire{
    position:absolute;
    font-size:40px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 15px gold, 0 0 30px hotpink;
    animation:flyName 2s ease-out forwards;
    pointer-events:none;
}

@keyframes explode{
    from{ transform:translate(0,0) scale(1); opacity:1; }
    to{ transform:translate(var(--x),var(--y)) scale(0.2); opacity:0; }
}
@keyframes flyName{
    from{ transform:translateY(100vh) scale(0.5); opacity:0; }
    to{ transform:translateY(0) scale(1.2); opacity:1; }
}
@keyframes float{
    from{transform:translateY(100vh);opacity:1;}
    to{transform:translateY(-10vh);opacity:0;}
}
@keyframes glitter{
    from{transform:translateY(100vh) scale(0.2);opacity:1;}
    to{transform:translateY(-10vh) scale(1);opacity:0;}
}
@keyframes glow{
    0%,100%{text-shadow:0 0 10px pink;}
    50%{text-shadow:0 0 25px red;}
}
@keyframes pop{
    from{transform:scale(0);}
    to{transform:scale(1);}
}
</style>
</head>

<body>

<button class="start" onclick="startLove()">Tap to start ❤️</button>

<div class="card" id="card">
    <h1>❤️ Happy Valentine's Day ❤️</h1>
    <p>Dear <b>Sahana 💕</b></p>
    <p>Nan jeevanadalli neene most special 😍</p>
    <p>Will you be my Valentine? 💖</p>
    <button onclick="showPopup()">Yes ❤️</button>
</div>

<div class="popup" id="popup">
    💖 Yayyy Sahana 😍<br>
    I Love You So Much 💕✨
</div>

<audio id="song">
    <source src="perfect.mp3" type="audio/mpeg">
</audio>

<script>
function startLove(){
    document.querySelector('.start').style.display="none";
    document.getElementById('card').style.display="block";
    document.getElementById('song').play();
    setInterval(createHeart,300);
    setInterval(createGlitter,150);
}

function showPopup(){
    document.getElementById('popup').classList.add('show');
    launchFireworks();
    flyingName();
}

function createHeart(){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
}

function createGlitter(){
    const g=document.createElement("div");
    g.className="glitter";
    g.style.left=Math.random()*100+"vw";
    g.style.width=g.style.height=(Math.random()*4+4)+"px";
    document.body.appendChild(g);
    setTimeout(()=>g.remove(),3000);
}

/* 🎆 FIREWORKS */
function launchFireworks(){
    for(let i=0;i<5;i++){
        setTimeout(createFirework, i*300);
    }
}

function createFirework(){
    const colors=["#ff004f","#ffd700","#00eaff","#ffffff","#ff6ec7"];
    const x=Math.random()*window.innerWidth;
    const y=Math.random()*window.innerHeight/2;

    for(let i=0;i<30;i++){
        const f=document.createElement("div");
        f.className="firework";
        f.style.background=colors[Math.floor(Math.random()*colors.length)];
        f.style.left=x+"px";
        f.style.top=y+"px";
        f.style.setProperty("--x",(Math.random()*200-100)+"px");
        f.style.setProperty("--y",(Math.random()*200-100)+"px");
        document.body.appendChild(f);
        setTimeout(()=>f.remove(),1500);
    }
}

/* ✨ FLYING NAME */
function flyingName(){
    const name=document.createElement("div");
    name.className="nameFire";
    name.innerText="SAHANA B K";
    name.style.left="50%";
    name.style.transform="translateX(-50%)";
    document.body.appendChild(name);

    setTimeout(()=>name.remove(),3000);
}
</script>

</body>
</html>
